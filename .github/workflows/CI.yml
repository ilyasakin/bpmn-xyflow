          "$CHROME_PATH" --version
          readlink -f "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Exercise native shape, edge and source-control hit priority
        run: node test/run-browser-suite.mjs test:browser:hits
      - name: Upload hit-priority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpmn-hit-priority-evidence
          path: test-artifacts/
          if-no-files-found: ignore
