name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # The runner's official Chrome installation has the supported AppArmor
      # profile; downloaded Chrome for Testing does not on Ubuntu 24.04.
      - name: Select installed sandbox-capable Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome)"
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
          readlink -f "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install independent XML schema validator
        run: python -m pip install lxml==6.1.1
      - name: Verify source and semantic parity
        run: pnpm run lint && pnpm run test:schema && pnpm run test:unit
      - name: Verify every independent browser suite
        run: |
          status=0
          for suite in test:smoke test:react test:multi test:browser:viewer test:browser:scenarios; do
            echo "::group::$suite"
            if pnpm run "$suite"; then
              echo "PASS $suite"
            else
              echo "FAIL $suite"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - name: Build distributable
        if: ${{ !cancelled() }}
        run: pnpm run build
      - name: Verify packed package consumers
        if: ${{ !cancelled() }}
        run: pnpm run test:package
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpmn-browser-evidence
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
