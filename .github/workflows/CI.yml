  anchor-followups:
    name: Native workflow ${{ matrix.suffix }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suffix: a-local }
          - { suffix: a-upstream }
          - { suffix: b-local-1 }
          - { suffix: b-local-2 }
          - { suffix: b-local-3 }
          - { suffix: b-upstream-1 }
          - { suffix: b-upstream-2 }
          - { suffix: b-upstream-3 }
          - { suffix: c-local }
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select installed sandbox-capable Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome)"
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
          readlink -f "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Exercise independent visible workflows
        run: node test/run-browser-suite.mjs test:browser:anchor-followup-${{ matrix.suffix }}
      - name: Upload workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpmn-anchor-followup-${{ matrix.suffix }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

