name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install browser
        run: pnpm exec puppeteer browsers install chrome-headless-shell --install-deps
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install independent XML schema validator
        run: python -m pip install lxml==6.1.1
      - name: Verify source and semantic parity
        run: pnpm run lint && pnpm run test:schema && pnpm run test:unit
      - name: Verify browser modeling and framework integration
        run: pnpm test
      - name: Build distributable
        run: pnpm run build
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpmn-browser-evidence
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
